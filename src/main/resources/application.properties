spring.application.name=h

spring.config.import=optional:file:.env[.properties]

logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} - %clr(%-5level)- %clr(%msg){white}%n

app.upload.comic-dir=upload/comic
app.upload.chapter-dir=upload/chapter

# H2 Database configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Server port
server.port=8080

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-milliseconds=1800000
app.jwt.refresh-expiration-milliseconds=604800000


# SpringDoc OpenAPI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
server.forward-headers-strategy=framework
