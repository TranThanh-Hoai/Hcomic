services:
  server:
    restart: unless-stopped
    image: tranhoai/hcomic-api:latest
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8080"

    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DB_URL: jdbc:postgresql://db:5432/hcomic_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-K9mP2xQ7nLs4Vz8RwH3tY6cFd1BaU5Je}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=60"
    volumes:
      - ./upload:/app/upload
  db:
    image: postgres:17
    restart: unless-stopped

    mem_limit: 512m
    environment:
      POSTGRES_DB: hcomic_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hcomic_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: