spring.application.name=h-test

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable Flyway during tests since tests use Hibernate create-drop
spring.flyway.enabled=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-milliseconds=86400000

# OAuth2 Dummy Client Configuration for tests
spring.security.oauth2.client.registration.google.client-id=dummy-test-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-test-client-secret
app.oauth2.authorized-redirect-uri=http://localhost:3000/oauth2/redirect
